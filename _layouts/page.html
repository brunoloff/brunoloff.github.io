<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.url == '/' %}{{ page.title | escape }} | {% endunless %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body{% if page.url == "/" %} class="homepage"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header-wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    </div>
  </header>
  <details class="site-navigation">
    <summary aria-label="Website navigation"><span aria-hidden="true">☰</span><span class="visually-hidden">Navigation</span></summary>
    <nav aria-label="Main navigation">
      <a href="/">Front page</a>
      <a href="/publications/">Publications</a>
      <a href="/hofga/">HoFGA</a>
      <a href="/tocsem/">Discrete Mathematics Seminar</a>
    </nav>
  </details>
  <main id="main" class="site-main">
    <article>
      <h1 class="entry-title">{{ page.title | escape }}</h1>
      <div class="entry-content">{{ content }}</div>
    </article>
  </main>
  <footer class="site-footer"><a href="{{ '/' | relative_url }}">Home</a> · <a href="{{ '/publications/' | relative_url }}">Publications</a> · <a href="{{ '/admin/' | relative_url }}">Edit website</a></footer>
</body>
</html>
