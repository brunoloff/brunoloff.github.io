<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Edit website | Bruno Loff</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <noscript>Enable JavaScript to use the website editor.</noscript>
  <script type="module">
    // Sveltia CMS built from the brunoloff/sveltia-cms fork (see scripts/sync-sveltia.sh).
    // Importing it sets window.CMS, h, DOMPurify, etc.; the site's scripts then register their
    // components and previews before the CMS starts.
    import CMS, { registerHtmlEditor } from '/assets/vendor/sveltia/sveltia-cms.js?v=76f19ceee9';
    // Page bodies are edited in place, styled like the published page (widget: html-editor).
    registerHtmlEditor(CMS, {
      stylesheets: ['/assets/css/fonts.css', '/assets/css/site.css'],
      wrapper: '<article><div class="entry-content">{content}</div></article>',
      bodyClass: (entry) => (entry?.getIn(['data', 'permalink']) === '/' ? 'homepage' : ''),
      extraCss: '.hte-page { max-width: 760px; margin: 0 auto; padding-inline: 32px; }',
    });
    const load = (src) => new Promise((resolve, reject) => {
      const script = Object.assign(document.createElement('script'), { src, onload: resolve, onerror: reject });
      document.head.append(script);
    });
    for (const src of ['/admin/components.js', '/admin/links.js', '/admin/preview.js']) await load(src);
    CMS.init();
  </script>
</body>
</html>
