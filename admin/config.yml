# yaml-language-server: $schema=./sveltia-cms.schema.json
backend:
  name: github
  repo: brunoloff/brunoloff.github.io
  branch: main
  auth_methods:
  - token
site_url: https://brunoloff.github.io
display_url: https://brunoloff.github.io
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
- name: main
  label: Main
  label_singular: Page
  icon: home
  description: Homepage, publications, and seminars.
  folder: pages
  create: true
  delete: false
  extension: html
  format: yaml-frontmatter
  filter:
    field: cms_collection
    pattern: ^main$
  preview_path: '{{permalink}}'
  fields:
  - name: title
    label: Title
    widget: string
  - name: cms_collection
    label: Collection
    widget: select
    options:
    - label: Main
      value: main
    - label: Courses
      value: courses
    - label: Research
      value: research
    - label: Archive
      value: archive
    default: main
    hint: Choose where this page appears in the editor.
  - name: description
    label: Search description
    widget: text
    required: false
    hint: Optional short description for search engines.
  - name: layout
    widget: hidden
    default: page
  - name: permalink
    label: Page address
    widget: string
    hint: Keep the existing address to preserve links. Use a leading and trailing
      slash, for example /my-page/.
    pattern:
    - ^/(?:[A-Za-z0-9_-]+/)*$
    - Use / or a path such as /my-page/.
  - name: body
    label: Page content
    widget: richtext
    format: html
    editor_components:
    - image
    - code-block
    - table
    - hr
    - photo
    - details
    buttons:
    - bold
    - italic
    - strikethrough
    - code
    - link
    - heading-one
    - heading-two
    - heading-three
    - heading-four
    - heading-five
    - heading-six
    - bulleted-list
    - numbered-list
    - quote
    - align
